name: Tests

# Ticket 78 (v0.20, §8.8.1): de bestaande testdiscipline automatisch
# afdwingen i.p.v. 'm van handmatige discipline af te laten hangen —
# draait de volledige headless Playwright-regressiesuite (tests/run-all.mjs)
# op elke push en pull request.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installeer dependencies
        run: npm ci

      # CI heeft geen /opt/pw-browsers/chromium (dat pad bestaat alleen in de
      # lokale ontwikkelomgeving) — helpers.mjs/run-all.mjs vallen via
      # feature-detectie automatisch terug op deze geïnstalleerde browser.
      # --with-deps installeert ook de systeemlibraries die Chromium op een
      # schone Ubuntu-runner nodig heeft.
      - name: Installeer Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Draai de testsuite
        run: node run-all.mjs
